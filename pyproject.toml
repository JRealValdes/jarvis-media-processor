[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis-media-processor"
version = "0.1.0"
description = "Independent multimedia processor: graft donor audio onto a base timeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "JRealValdes" }]
dependencies = [
    "numpy>=2.4.6",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "scipy>=1.17.1",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "scipy-stubs>=1.17.1.5",
]

[project.scripts]
jmp = "jarvis_media_processor.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_media_processor"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["jarvis_media_processor"]
